name: OS Build

# Triggered from open_mower_ros once it has a public ghcr image ready (see
# build-image.yaml's and push-pr-image.yaml's "merge" jobs there) -- this
# repo never needs to check out or build open_mower_ros itself, just pull
# the image by reference. workflow_dispatch is kept as a manual entry point
# for testing without needing a real dispatch from that repo.
#
# push (main, os/** only): an os/-only fix has no new open_mower_ros image to
# pair with, so build against `edge` -- open_mower_ros's own always-current
# main-branch tag (see that repo's build-image.yaml "Docker meta (Default)"
# step, `type=edge,branch=main`), same image a same-day repository_dispatch
# from that repo would have resolved to anyway.
on:
  push:
    branches: [main]
    paths: ['os/**']
  workflow_dispatch:
    inputs:
      image:
        description: 'ghcr image ref to build against, e.g. ghcr.io/clemenselflein/open_mower_ros:sha-abc1234'
        required: true
        type: string
      ref:
        description: 'Branch/PR/tag name this build is for (cosmetic, used for the run name)'
        required: false
        type: string
        default: 'manual'
      build_sdcard:
        description: 'Also build the full flashable sdcard.img'
        default: false
        type: boolean
      is_release:
        description: 'Tag + publish a GitHub Release from this build'
        default: false
        type: boolean
      tag_name:
        description: 'Release tag name (required if is_release is set)'
        required: false
        type: string
  repository_dispatch:
    types: [os-build]

run-name: >-
  OS build for
  ${{
    github.event.client_payload.event == 'PR' && format('PR {0}', github.event.client_payload.ref) ||
    github.event.client_payload.event == 'BRANCH' && format('branch {0}', github.event.client_payload.ref) ||
    github.event.client_payload.event == 'TAG' && format('tag {0}', github.event.client_payload.ref) ||
    github.event_name == 'push' && format('os push {0}', github.ref_name) ||
    github.event.inputs.ref || 'manual'
  }}
  @ ${{ github.event.client_payload.sha || (github.event_name == 'push' && github.sha) || 'manual' }}

# Keyed on event type + ref (PR number / branch / tag name), not sha: two
# builds for the same PR/branch/tag supersede each other (new push cancels
# the stale in-progress build for it), while different PRs, a PR and a
# branch, etc. get distinct groups and run fully in parallel. Manual
# dispatch has no client_payload at all, so it falls back to the image ref
# instead, same as before. Push (no client_payload either) gets its own
# explicit branch rather than falling through to 'manual' -- github.ref_name
# is also set on a manual dispatch run, and reusing that fallback there
# would regroup concurrent manual runs by branch instead of by image.
concurrency:
  group: os-build-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.event || github.event_name == 'push' && 'push' || 'manual' }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event_name == 'push' && github.ref_name || github.event.inputs.image }}
  cancel-in-progress: true

permissions:
  contents: write   # only actually used by the release step, tag builds only
  actions: write    # deleting the stale Buildroot cache entry below (write) so it can be re-saved

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Resolve inputs
        id: in
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "event=${{ github.event.client_payload.event }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.client_payload.ref }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.client_payload.sha }}" >> "$GITHUB_OUTPUT"
            echo "image=${{ github.event.client_payload.image }}" >> "$GITHUB_OUTPUT"
            # String-compare after GH's own stringification, not a GH-expression
            # `== true`: GH coerces mismatched types by converting to number,
            # so a client_payload.is_release sent as the JSON string "true"
            # (e.g. from `gh api -f`) would silently compare unequal to the
            # boolean literal `true` there.
            echo "is_release=$([ '${{ github.event.client_payload.is_release }}' = 'true' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ github.event.client_payload.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "build_sdcard=$([ '${{ github.event.client_payload.is_release }}' = 'true' ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
            echo "source_repo=${{ github.event.client_payload.source_repo }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # api.openmower.de only knows PR/BRANCH/TAG (see open_mower_ros's
            # own "Trigger OS build" step) -- BRANCH is correct here, not a
            # fourth mode: this build IS the latest build for this branch,
            # same bucket `update-os --from-branch`/VERSION=edge already
            # queries, whichever side (open_mower_ros or this repo) produced
            # it more recently.
            echo "event=BRANCH" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            # No new open_mower_ros image to pair an os/-only push with --
            # build against its always-current main-branch tag instead (see
            # the `on:` block comment above).
            echo "image=ghcr.io/clemenselflein/open_mower_ros:edge" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=" >> "$GITHUB_OUTPUT"
            echo "build_sdcard=0" >> "$GITHUB_OUTPUT"
            echo "source_repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
          else
            echo "event=manual" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "source_repo=" >> "$GITHUB_OUTPUT"
            echo "image=${{ github.event.inputs.image }}" >> "$GITHUB_OUTPUT"
            echo "is_release=${{ github.event.inputs.is_release }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "build_sdcard=$([ '${{ github.event.inputs.is_release }}' = 'true' ] || [ '${{ github.event.inputs.build_sdcard }}' = 'true' ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # Only os/buildroot is needed to build -- the repo's other submodules
      # (software/firmware/hardware, see .gitmodules) are unrelated
      # ecosystem trackers, multiple GB combined, that a full `submodules:
      # recursive` checkout would pull for nothing on every run.
      - name: Check out os/buildroot submodule
        run: git submodule update --init os/buildroot

      - name: Resolve Buildroot submodule commit
        id: buildroot-rev
        run: echo "sha=$(git -C os/buildroot rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # Stable CI signing identity instead of build.sh's own default (a
      # fresh throwaway keypair generated every run and discarded with the
      # runner). NOT the production key -- that stays offline per the
      # README; this is a dedicated CI dev key. Falls through to build.sh's
      # own generate-on-demand default if the secrets aren't set.
      - name: Install the CI dev signing key
        env:
          RAUC_CI_DEV_CERT: ${{ secrets.RAUC_CI_DEV_CERT }}
          RAUC_CI_DEV_KEY: ${{ secrets.RAUC_CI_DEV_KEY }}
        run: |
          if [ -z "$RAUC_CI_DEV_CERT" ]; then
            echo "No RAUC_CI_DEV_CERT secret set, falling back to build.sh's own throwaway key"
            exit 0
          fi
          mkdir -p os/keys
          printf '%s' "$RAUC_CI_DEV_CERT" > os/keys/dev-cert.pem
          printf '%s' "$RAUC_CI_DEV_KEY" > os/keys/dev-key.pem
          chmod 600 os/keys/dev-key.pem

      # Single fixed key: this repo's Actions cache pool is dedicated to
      # this one workflow (no docker buildx cache or anything else
      # competing for the shared 10GB-per-repo cap), so there's no eviction
      # pressure the way there was when this cache lived alongside
      # open_mower_ros' docker layer cache.
      #
      # dl/ccache/openmower-cli/output-build.hash ONLY here -- downloaded
      # tarballs and compiled-object cache are safe to reuse no matter what
      # the defconfig says, so a rolling key that's never invalidated is
      # exactly right for these. output/build|host moved to their own
      # content-hash-keyed cache below: they hold Buildroot's per-package
      # .stamp_configured/.stamp_built, which Buildroot only invalidates on
      # a package's own source changing, NOT on some OTHER package's
      # Kconfig `select` newly pulling in a suboption it didn't have before
      # (e.g. wavemon selecting BR2_PACKAGE_LIBNL_TOOLS onto an
      # already-built libnl). Restoring an output/build from before that
      # kind of defconfig change re-stages the old build untouched instead
      # of reconfiguring -- silent wrong-bits, not a cache miss. Keeping it
      # on the same rolling key as this cache meant every defconfig change
      # needed the delete-step below to actually take effect before the
      # NEXT run could recover; splitting it out means the key itself
      # changes and there's nothing to invalidate.
      #
      # .cache/output-build.hash (build.sh's own marker for this same
      # cross-package-select blind spot, see build.sh) MUST live in this
      # always-restored/-saved cache, not just on the runner's disk: it's
      # the only thing that tells build.sh "the output/build cache you just
      # restored above already matches these config inputs, leave its
      # .stamp_configured/.stamp_built alone". Missing from here, every CI
      # run starts without it, build.sh treats that as "config changed" on
      # every single run, and force-wipes .stamp_configured/.stamp_built
      # for every package in the just-restored (perfectly valid)
      # output/build tree -- including autoreconf-based packages like
      # e2fsprogs, whose source is already libtool-patched from that prior
      # build. Forcing them back through configure hits the buildroot
      # LIBTOOL_PATCH_HOOK re-applying its patch onto already-patched
      # content ("Reversed (or previously applied) patch detected!"),
      # deterministically, on every run.
      #
      # Explicit restore, not the combined actions/cache@v4 (restore + an
      # automatic post-job save): the automatic post-save is unreliable
      # exactly when this job gets cancelled by a concurrency-group
      # cancel-in-progress. Explicit save steps gated on if: always() below
      # don't have that problem.
      - name: Restore Buildroot dl/ccache cache
        uses: actions/cache/restore@v4
        with:
          path: |
            os/.cache/dl
            os/.cache/ccache
            os/.cache/openmower-cli
            os/.cache/output-build.hash
          key: os-build-dl

      # Content-hash key, no restore-keys fallback -- unlike the kernel
      # caches below (where a prefix-matched near-miss is still a useful
      # warm start because Buildroot's kernel package correctly re-runs
      # olddefconfig + incremental kbuild on a .config diff), a stale
      # output/build|host for a GENERIC package is exactly the silent
      # re-staged-instead-of-reconfigured bug this split exists to avoid --
      # a prefix fallback here would hand back the very cache entry the
      # hash changed to get away from. Exact hash miss => empty dirs =>
      # full fresh package build, same as a first-ever run.
      - name: Restore Buildroot output cache
        id: restore-output
        uses: actions/cache/restore@v4
        with:
          path: |
            os/output/build
            os/output/host
          key: os-build-output-${{ steps.buildroot-rev.outputs.sha }}-${{ hashFiles('os/external/configs/openmower_defconfig', 'os/external/configs/openmower_dev_defconfig', 'os/external/Config.in', 'os/external/package/**') }}

      # Content-hash keys (not the single rolling "os-build-dl" key above):
      # the kernel defconfigs/fragments -- and the pinned Buildroot commit,
      # which also gates the toolchain/patches/linux.mk logic actually used
      # to build them -- change rarely, so let actions/cache's own "never
      # overwrites an existing key" behavior do the staleness check for us
      # instead of the delete+save dance the rolling key needs: same inputs
      # next run => same key => exact hit => the Save step below is a
      # guaranteed no-op (nothing to upload), not just a fast one. Only an
      # actual kernel-affecting change produces a new key, which naturally
      # triggers a real save. restore-keys falls back to the most recent
      # cache for the same Buildroot commit if the exact defconfig/fragment
      # hash doesn't match (e.g. a fragment tweak) -- still a useful warm
      # start (extracted kernel source, prior .stamp_* files) even on a
      # miss, on top of the ccache hits the "os-build-dl" cache's
      # os/.cache/ccache already gives any changed kernel objects
      # individually.
      - name: Restore CM4 kernel cache
        id: restore-cm4
        uses: actions/cache/restore@v4
        with:
          path: |
            os/output-kernel-cm4/build
            os/output-kernel-cm4/host
          key: os-kernel-cm4-${{ steps.buildroot-rev.outputs.sha }}-${{ hashFiles('os/external/configs/openmower_kernel-cm4_defconfig', 'os/external/board/openmower-kernel/kernel-fragment-common.config', 'os/external/board/openmower-kernel/kernel-fragment-cm4.config') }}
          restore-keys: |
            os-kernel-cm4-${{ steps.buildroot-rev.outputs.sha }}-

      - name: Restore CM5 kernel cache
        id: restore-cm5
        uses: actions/cache/restore@v4
        with:
          path: |
            os/output-kernel-cm5/build
            os/output-kernel-cm5/host
          key: os-kernel-cm5-${{ steps.buildroot-rev.outputs.sha }}-${{ hashFiles('os/external/configs/openmower_kernel-cm5_defconfig', 'os/external/board/openmower-kernel/kernel-fragment-common.config', 'os/external/board/openmower-kernel/kernel-fragment-cm5.config') }}
          restore-keys: |
            os-kernel-cm5-${{ steps.buildroot-rev.outputs.sha }}-

      # OMR_SOURCE=ghcr (build.sh's own default) pulls OMR_IMAGE itself --
      # no separate docker pull/load step needed here. The image is always
      # public (push/tag builds publish to ghcr on push; PR builds publish
      # a pr-<number> tag too, see push-pr-image.yaml in open_mower_ros),
      # so no registry auth is required either.
      - name: Build
        id: build
        working-directory: os
        env:
          OMR_IMAGE: ${{ steps.in.outputs.image }}
          OPENMOWER_BUILD_SDCARD: ${{ steps.in.outputs.build_sdcard }}
        run: ./build.sh image

      # Filename is openmower-<version>.raucb, version = the UTC timestamp
      # build.sh stamped this build with (see post-image.sh) -- pull it back
      # out for the notify payload below rather than recomputing a new one,
      # since a recomputed value wouldn't actually match what's in the bundle.
      - name: Extract build version
        id: version
        run: |
          RAUCB="$(basename os/output/images/openmower-*.raucb)"
          VERSION="${RAUCB#openmower-}"
          VERSION="${VERSION%.raucb}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # if: always() so this still runs when Build fails or the job gets
      # cancelled mid-Build -- a failed/cancelled build has still done most
      # of the slow work (downloads, ccache), which is exactly what a
      # following debugging run wants restored.
      # Delete-then-save because actions/cache/save silently no-ops on an
      # existing key -- must clear it first so the save below actually lands.
      - name: Delete stale Buildroot dl/ccache cache entry
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete os-build-dl --repo "${{ github.repository }}" || true

      - name: Save Buildroot dl/ccache cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            os/.cache/dl
            os/.cache/ccache
            os/.cache/openmower-cli
            os/.cache/output-build.hash
          key: os-build-dl

      # No delete-first step needed here, same reasoning as the kernel
      # caches below: content-hash key means an exact-hit run has nothing
      # changed to save, and a changed defconfig/package produces a brand
      # new key rather than needing the old one cleared first.
      #
      # cache-hit != 'true' -- an exact-hit restore means this key is
      # already saved, so attempting the save again would just have
      # actions/cache/save@v4 fail to reserve the (already-taken) key and
      # emit a spurious "Cache save failed." warning annotation for a
      # completely expected no-op (the save-only action warns on cacheId
      # == -1 unconditionally, it doesn't distinguish "key already exists"
      # from a real failure). Skip the attempt entirely instead.
      #
      # if: success() -- NOT always(), unlike the dl/ccache cache above.
      # output/build|host holds Buildroot's per-package .stamp_patched/
      # .stamp_configured/.stamp_built state machine, not just reusable raw
      # inputs. A failed or cancel-in-progress-killed Build step can leave a
      # package mid-recipe: Make deletes the stamp file on recipe
      # failure/signal, but files a patch step already touched (e.g.
      # e2fsprogs' ltmain.sh) stay modified on disk. Caching that under this
      # content-hash key (no delete-first step, no restore-keys fallback, and
      # actions/cache/save silently no-ops on an existing key) would poison
      # every future run for this exact (buildroot rev, defconfig) pair with
      # a "Reversed (or previously applied) patch" failure that can't self-heal
      # until the hash itself changes. The genuinely expensive/reusable work
      # (downloads, compiled objects) is already covered by the always-saved
      # os-build-dl cache above, so skipping this save on failure costs
      # nothing but a slower next attempt.
      - name: Save Buildroot output cache
        if: success() && steps.restore-output.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            os/output/build
            os/output/host
          key: os-build-output-${{ steps.buildroot-rev.outputs.sha }}-${{ hashFiles('os/external/configs/openmower_defconfig', 'os/external/configs/openmower_dev_defconfig', 'os/external/Config.in', 'os/external/package/**') }}

      # No delete-first step needed for either of these two, unlike the
      # rolling "os-build-dl" key above -- an exact-hit run (nothing
      # kernel-related changed) has nothing new to save, so it shouldn't
      # upload ~6GB of unchanged kernel build output just to re-produce the
      # cache entry that's already there.
      #
      # cache-hit != 'true' -- same reasoning as the Buildroot output cache
      # above: on an exact hit the key is already saved, so skip the
      # attempt rather than let actions/cache/save@v4 fail to reserve it
      # and emit a spurious "Cache save failed." warning for an expected
      # no-op. Note cache-hit is only 'true' on an exact primary-key match,
      # not a restore-keys prefix fallback -- a fallback-restored near-miss
      # still has genuinely new content (this key itself was never saved),
      # so it correctly falls through and saves.
      #
      # if: success() -- same reasoning as the main "Save Buildroot output
      # cache" step above: these hold per-package .stamp_patched/
      # .stamp_configured/.stamp_built state too, and a failed/cancelled
      # run's half-patched tree would otherwise poison this key permanently
      # for the same (buildroot rev, kernel defconfig) pair.
      - name: Save CM4 kernel cache
        if: success() && steps.restore-cm4.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            os/output-kernel-cm4/build
            os/output-kernel-cm4/host
          key: os-kernel-cm4-${{ steps.buildroot-rev.outputs.sha }}-${{ hashFiles('os/external/configs/openmower_kernel-cm4_defconfig', 'os/external/board/openmower-kernel/kernel-fragment-common.config', 'os/external/board/openmower-kernel/kernel-fragment-cm4.config') }}

      - name: Save CM5 kernel cache
        if: success() && steps.restore-cm5.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            os/output-kernel-cm5/build
            os/output-kernel-cm5/host
          key: os-kernel-cm5-${{ steps.buildroot-rev.outputs.sha }}-${{ hashFiles('os/external/configs/openmower_kernel-cm5_defconfig', 'os/external/board/openmower-kernel/kernel-fragment-common.config', 'os/external/board/openmower-kernel/kernel-fragment-cm5.config') }}

      - name: Upload RAUC bundle
        uses: actions/upload-artifact@v4
        with:
          name: openmower-os-raucb
          path: os/output/images/openmower-*.raucb
          if-no-files-found: error
          retention-days: 14

      - name: Upload sdcard.img
        if: steps.in.outputs.build_sdcard == '1'
        uses: actions/upload-artifact@v4
        with:
          name: openmower-os-sdcard
          path: os/output/images/sdcard.img
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: steps.in.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.in.outputs.tag_name }}
          files: |
            os/output/images/openmower-*.raucb
            os/output/images/sdcard.img

      # Push-notify api.openmower.de instead of it having to poll/scrape
      # Actions runs to find "the latest build for ref X". Branch/PR builds
      # only exist as a GH Actions artifact (14-day retention, same as
      # open_mower_ros always did this) -- api.openmower.de already knows
      # how to proxy those so openmower-cli never needs a GitHub account.
      # Tag builds are a proper public Release instead (created above), so
      # the asset is directly downloadable with no proxying needed.
      # Skipped (not failed) if the secret isn't set yet -- lets this land
      # before the backend endpoint exists.
      - name: Notify api.openmower.de
        env:
          TOKEN: ${{ secrets.OPENMOWER_API_TOKEN }}
          EVENT: ${{ steps.in.outputs.event }}
          REF: ${{ steps.in.outputs.ref }}
          SHA: ${{ steps.in.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          IS_RELEASE: ${{ steps.in.outputs.is_release }}
          TAG_NAME: ${{ steps.in.outputs.tag_name }}
          REPO: ${{ github.repository }}
          SOURCE_REPO: ${{ steps.in.outputs.source_repo }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No OPENMOWER_API_TOKEN secret set, skipping api.openmower.de notify"
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg event "$EVENT" --arg ref "$REF" --arg sha "$SHA" \
            --arg version "$VERSION" --argjson is_release "$IS_RELEASE" \
            --arg tag_name "$TAG_NAME" --arg repo "$REPO" --arg source_repo "$SOURCE_REPO" \
            --argjson run_id "$RUN_ID" --arg artifact_name "openmower-os-raucb" \
            '{event: $event, ref: $ref, sha: $sha, version: $version,
              is_release: $is_release, tag_name: $tag_name, repo: $repo,
              source_repo: $source_repo, run_id: $run_id, artifact_name: $artifact_name}')
          MAX_ATTEMPTS=10
          ATTEMPT=1
          DELAY=1
          until curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.openmower.de/v1/os-build?build-key=$TOKEN"; do
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Failed to notify api.openmower.de after $ATTEMPT attempts"
              exit 1
            fi
            echo "Notify attempt $ATTEMPT failed, retrying in ${DELAY}s..."
            sleep "$DELAY"
            ATTEMPT=$((ATTEMPT + 1))
            DELAY=$((DELAY * 2))
          done
