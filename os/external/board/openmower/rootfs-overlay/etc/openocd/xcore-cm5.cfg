#
# OpenOCD config for flashing/debugging the xCore (LL board MCU) via SWD,
# using the CM5 (BCM2712) itself as a bitbang adapter. Uses the
# `linuxgpiod` driver (BR2_PACKAGE_LIBGPIOD, auto-enables openocd's
# --enable-linuxgpiod): BCM2712 dropped the direct peripheral register
# access `bcm2835gpio` relies on (see xcore-cm4.cfg), so this goes through
# the kernel gpiochip character device instead. openmower-detect-hardware
# symlinks /etc/openocd/xcore.cfg to whichever of these two matches the
# board this image is actually running on; nothing should reference this
# file by name directly.
#
# Usage: openocd -f /etc/openocd/xcore.cfg
#
# Not verified on real hardware -- pin numbers carried over unchanged from
# xcore-cm4.cfg on the assumption that OpenMower's CM5 carrier is wired
# identically to its CM4 carrier (both are pin-compatible with the official
# Raspberry Pi CM4 IO Board, see usercfg.txt.default's [cm4]/[cm5]
# sections) -- check swclk/swdio pin numbers against your actual wiring
# before relying on this.

adapter driver linuxgpiod
adapter gpiochip 0

# Each of the SWD lines need a gpio number set: swclk swdio
# OpenMower pins
adapter gpio swclk -chip 0 27
adapter gpio swdio -chip 0 22

transport select swd
