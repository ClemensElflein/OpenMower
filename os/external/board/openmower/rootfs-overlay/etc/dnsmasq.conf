# DHCP server for the internal CM4<->xCore link (172.16.78.0/24), now
# listening on br0 (eth0 + the USB0 gadget's usb0 ethernet function
# bridged together, see 15-br0.netdev/20-ethernet.network/
# 21-usb-ethernet.network) instead of eth0 directly, so USB-attached hosts
# get DHCP leases exactly like eth0-attached ones. Just one instance -- no
# second dnsmasq for a WiFi-AP fallback (no AP/captive-portal path here).
#
# DNS service intentionally disabled (port=0) -- systemd-resolved already
# owns that (see /etc/nsswitch.conf), no reason to run two.
port=0

interface=br0
bind-dynamic
listen-address=172.16.78.1

dhcp-range=172.16.78.150,172.16.78.200,255.255.255.0,1h
dhcp-sequential-ip
log-dhcp
