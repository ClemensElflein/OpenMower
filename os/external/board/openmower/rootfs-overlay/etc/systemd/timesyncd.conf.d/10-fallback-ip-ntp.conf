# IP literals, deliberately not hostnames -- this is specifically the
# bootstrap path for a device that's been powered off long enough that
# its persisted clock (see openmower-timesync-persist.service) is stale
# outside any current DNSSEC signature's validity window. Normal
# hostname-based NTP would need DNS to resolve the hostname, which on
# this board goes through systemd-resolved's DNSSEC validation, which
# needs a correct clock to succeed -- the exact deadlock this file exists
# to break. An IP literal has no DNS step at all, so it works regardless
# of how wrong the clock currently is. Once this sync lands, the clock is
# correct and every subsequent (hostname-based, DNSSEC-validated) lookup
# on the device works normally again.
#
# Two independent operators (Cloudflare, Google), each publishing their
# own anycast NTP IP as of 2026 (developers.cloudflare.com/time-services,
# developers.google.com/time) -- redundancy in case one changes or is
# unreachable from wherever this device is deployed. This is a bootstrap
# fallback only, not a precision time source, so mixing Google's
# leap-second-smeared servers with Cloudflare's non-smeared one is a
# non-issue here.
[Time]
FallbackNTP=162.159.200.1 216.239.35.0
