[Unit]
# The persistent pairing database is on /data, while /var is tmpfs.
RequiresMountsFor=/data
After=systemd-tmpfiles-setup.service

[Service]
# Keep BlueZ's StateDirectory=bluetooth as a real directory: systemd refuses
# to create managed state directories through a symlink. This bind mount is
# visible only to bluetoothd and preserves its existing sandboxing.
BindPaths=/data/bluetooth:/var/lib/bluetooth
