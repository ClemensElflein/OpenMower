# DNSSEC off -- this board has no battery-backed RTC (none populated on
# CM4/CM5), so the clock always starts wrong on a cold boot until the
# first NTP sync lands. DNSSEC validates each record's signature against
# the *current* clock, so every lookup made before that first sync fails
# hard with "signature-expired" -- including resolving systemd-timesyncd's
# own NTP server hostnames. That's a genuine deadlock: no correct clock
# without NTP, no NTP without DNS, no validated DNS without a correct
# clock. DNSSEC=allow-downgrade (the compiled-in default) doesn't help --
# it only downgrades when the upstream server lacks DNSSEC support, not
# when local validation fails on a signature that looks expired. Confirmed
# on real hardware: `resolvectl query` failed with exactly "DNSSEC
# validation failed: signature-expired" while the clock was still ~5
# months behind real time; DNS worked immediately once the clock was
# corrected.
[Resolve]
DNSSEC=no
