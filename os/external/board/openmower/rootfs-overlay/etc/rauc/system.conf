[system]
# One unified image boots both CM4 and CM5 (see openmower-detect-hardware) --
# deliberately no per-board suffix, so RAUC no longer acts as a
# hardware-mismatch interlock the way it used to (accepted trade-off).
compatible=openmower
bootloader=custom
statusfile=/data/.openmower-os/rauc/status.ini

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
bootloader-custom-backend=/usr/lib/rauc/tryboot-backend

[slot.boot.0]
device=/dev/mmcblk0p2
type=vfat
bootname=A

[slot.rootfs.0]
device=/dev/mmcblk0p5
type=raw
parent=boot.0

[slot.boot.1]
device=/dev/mmcblk0p3
type=vfat
bootname=B

[slot.rootfs.1]
device=/dev/mmcblk0p6
type=raw
parent=boot.1
