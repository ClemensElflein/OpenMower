# Persistent state directories on /data
d /data/wifi 0700 root root -
# OS-internal state a user never needs to browse -- tucked away in its own
# hidden dir so `ls /data` stays readable (just wifi/openmower/boot/stacks/
# dockge, the things a user might actually want to look at).
d /data/.openmower-os 0755 root root -
d /data/.openmower-os/dropbear 0700 root root -
d /data/.openmower-os/rauc 0755 root root -
d /data/.openmower-os/update 0755 root root -
d /data/.openmower-os/bluetooth 0700 root root -
d /data/openmower 0755 1000 1000 -
d /data/openmower/ros 0755 1000 1000 -
d /data/openmower/recordings 0755 1000 1000 -
d /data/openmower/params 0755 1000 1000 -
d /data/boot 0755 root root -
# First-boot defaults (only copied if the destination doesn't already exist)
# so the service can start with generic-but-safe values instead of blocking
# forever, and so /data/openmower/openmower.conf actually exists to edit
# instead of you having to know to create it from scratch -- see
# external/package/openmower-ros.
C /data/openmower/params/mower_params.yaml 0664 1000 1000 - /etc/openmower/mower_params.yaml.default
C /data/openmower/openmower.conf 0664 1000 1000 - /etc/openmower/openmower.conf
# Local config.txt overrides (antenna selection, etc.) -- see
# openmower-sync-bootcfg and usercfg.txt.default's own comments. config.txt
# itself is NOT seeded here (unlike usercfg.txt) -- it ships read-only in
# the rootfs (/etc/openmower/config.txt.default) and is baked directly onto
# the boot partition at image-build time, nothing to browse or edit on
# /data for it.
C /data/boot/usercfg.txt 0644 root root - /etc/openmower/usercfg.txt.default
