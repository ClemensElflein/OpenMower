# dnsmasq wants to write its DHCP lease file to /var/lib/misc/dnsmasq.leases
# by default. /var is tmpfs on this image (fresh, empty every boot -- see
# /etc/fstab) and nothing else creates this directory: buildroot's dnsmasq
# package ships only the binary + a SysV init script (unused here, we run
# our own systemd unit), no Debian-style postinst to set this up. Without
# it dnsmasq fails outright at startup ("cannot open or create lease file
# ...: No such file or directory", status=3/NOTIMPLEMENTED, observed in
# practice) and crash-loops.
d /var/lib/misc 0755 root root -
