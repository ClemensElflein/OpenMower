# Root's home persists on /data -- /etc/passwd's root entry points HOME at
# /data/root directly (see post-build.sh; NOT a /root symlink -- that
# collides with a generic buildroot device-table entry, see that script's
# own comment) so root's $HOME survives reboots and RAUC A/B updates, same
# reasoning as /data/dropbear and /data/openmower: without this, anything
# that writes under $HOME (bash history, ssh known_hosts, and critically
# openmower-cli's shiv extraction cache and any config it persists) silently
# vanishes every reboot since root is read-only squashfs.
#
# "C" (not "d") for .bashrc/.profile: copies the /etc/skel default onto
# /data/root the FIRST time only, never overwriting an already-persisted
# copy -- same pattern as /data/openmower/openmower.conf and the Dockge/
# Mosquitto stack defaults (see docker-stacks.conf/openmower.conf).
d /data/root 0700 root root -
C /data/root/.bashrc 0644 root root - /etc/skel/.bashrc
C /data/root/.profile 0644 root root - /etc/skel/.profile
