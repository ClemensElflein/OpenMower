# Root's home persists on /data -- /etc/passwd's root entry points HOME at
# /data/.openmower-os/root directly (see post-build.sh; NOT a /root symlink
# -- that collides with a generic buildroot device-table entry, see that
# script's own comment) so root's $HOME survives reboots and RAUC A/B
# updates, same reasoning as /data/.openmower-os/dropbear and
# /data/openmower: without this, anything that writes under $HOME (bash
# history, ssh known_hosts, and critically openmower-cli's shiv extraction
# cache and any config it persists) silently vanishes every reboot since
# root is read-only squashfs. Tucked under .openmower-os (not a bare
# /data/root) so it doesn't show up as its own top-level entry in `ls
# /data` -- a user logged in as root already reaches it via `~`/`$HOME`,
# no need for it to also clutter the listing.
#
# "C" (not "d") for .bashrc/.profile: copies the /etc/skel default onto
# /data/.openmower-os/root the FIRST time only, never overwriting an
# already-persisted copy -- same pattern as /data/openmower/openmower.conf
# and the Dockge/Mosquitto stack defaults (see
# docker-stacks.conf/openmower.conf).
d /data/.openmower-os/root 0700 root root -
C /data/.openmower-os/root/.bashrc 0644 root root - /etc/skel/.bashrc
C /data/.openmower-os/root/.profile 0644 root root - /etc/skel/.profile
