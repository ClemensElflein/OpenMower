# Disk layout. MBR; genimage puts partitions 4+ into an extended partition,
# so the runtime numbering is:
#   p1 config (autoboot.txt)   p2 boot-a   p3 boot-b
#   p5 rootfs-a   p6 rootfs-b   p7 data
# Keep in sync with: autoboot.txt, cmdline-{a,b}.txt, rootfs-overlay/etc/rauc/system.conf.
# This is also the ONLY place the layout is defined: when migrating a device
# off stock Raspberry Pi OS (see scripts/migrate-to-openmower.sh), the
# migration initramfs (../openmower-cm4-migration/rootfs-overlay/init) just
# `dd`s the resulting sdcard.img wholesale rather than re-declaring
# partitions itself -- except for the "p7 = data" number above, which it
# does still hardcode to mount the data partition afterward, so keep that
# one number in sync here too if it ever changes.

image config.vfat {
	vfat {
		label = "config"
		files = { "autoboot.txt" }
	}
	size = 16M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	# Sized for OTA bundle staging (the vendored ROS/Ubuntu payload makes
	# bundles multi-GB, downloaded here in full before rauc install) plus
	# wifi/bluetooth/rauc state and optional rosbag recordings. Starting
	# budget — re-tune after measuring real bundle sizes.
	size = 4096M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		align = 4M
	}

	partition config {
		partition-type = 0xC
		image = "config.vfat"
	}

	partition boot-a {
		partition-type = 0xC
		image = "boot-a.vfat"
	}

	partition boot-b {
		partition-type = 0xC
		image = "boot-b.vfat"
	}

	# Sized to fit the vendored ROS Noetic + Ubuntu Focal userland (see
	# external/package/openmower-ros) on top of the base OS. Starting
	# budget, not measured yet — re-tune (`du -sh output/target`,
	# `ls -la output/images/*.squashfs`) after the first real build.
	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 3584M
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 3584M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
