# Disk layout. MBR; genimage puts partitions 4+ into an extended partition,
# so the runtime numbering is:
#   p1 config (autoboot.txt)   p2 boot-a   p3 boot-b
#   p5 rootfs-a   p6 rootfs-b   p7 data
# Sizes: config 16M, boot-a/boot-b 192M each, rootfs-a/rootfs-b 3072M each,
# data 64M build-time floor (grows to fill real media on first boot, see
# rootfs-overlay/usr/bin/openmower-expand-data) -- built sdcard.img is
# ~6.5GiB. p7 (data) MUST stay the last partition for that first-boot grow
# to work at all (extends the last partition table entry into whatever's
# unpartitioned past it).
# Keep in sync with: autoboot.txt, cmdline-{a,b}.txt, rootfs-overlay/etc/rauc/system.conf.
# This is also the ONLY place the layout is defined: when migrating a device
# off stock Raspberry Pi OS (see scripts/migrate-to-openmower.sh), the
# migration initramfs (../openmower-cm4-migration/rootfs-overlay/init) just
# `dd`s the resulting sdcard.img wholesale rather than re-declaring
# partitions itself -- except for the "p7 = data" number above, which it
# does still hardcode to mount the data partition afterward, so keep that
# one number in sync here too if it ever changes.

image config.vfat {
	vfat {
		label = "config"
		files = { "autoboot.txt" }
	}
	size = 16M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	# Build-time FLOOR, not the real budget -- openmower-expand-data grows
	# this partition (sfdisk ", +" + partx -u + resize2fs) to fill whatever
	# real media the image ends up flashed to, on first boot (very early,
	# before anything meaningful is written here). Kept minimal rather
	# than sized to fit a full OTA bundle: at any size close to a real
	# bundle (~955MiB measured), ext4 metadata/reserved-block overhead
	# eats the margin that would supposedly buy anyway, so a bigger floor
	# wasn't actually a real guarantee -- see the sizing note on partition
	# rootfs-a for the same reasoning applied to the bigger (unsolvable at
	# any floor size) 8GB-eMMC ceiling question. 64M is just steady-state
	# headroom for the pre-expand window (dropbear keys, wifi config,
	# machine-id -- all KB-scale) plus ext4's own overhead on a small fs.
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		align = 4M
	}

	partition config {
		partition-type = 0xC
		image = "config.vfat"
	}

	partition boot-a {
		partition-type = 0xC
		image = "boot-a.vfat"
	}

	partition boot-b {
		partition-type = 0xC
		image = "boot-b.vfat"
	}

	# Sized to fit the vendored ROS Noetic + Ubuntu Focal userland (see
	# external/package/openmower-ros) on top of the base OS. Measured
	# squashfs on a real build: 936MiB -- 3072M budgets ~3.3x headroom for
	# growth.
	#
	# 3072M x2 + config/boot-a/boot-b (400M) leaves only ~1GiB of `data`
	# after openmower-expand-data's first-boot grow on an 8GB eMMC (~7.4GiB
	# real usable), well under this budget's own 3072M ceiling -- so IF
	# actual rootfs usage ever grows to fill this budget, an 8GB device
	# will not have room to stage that size bundle and stops being
	# updatable. Deliberately accepted (not sized down to preserve full
	# update headroom on 8GB media indefinitely): 8GB eMMC is treated as a
	# bounded/legacy tier that may eventually reach end-of-updates as the
	# OS grows, same as many embedded products with fixed flash budgets.
	# 16GB+ media keep full headroom throughout (see os/README.md's "Disk
	# layout" section).
	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 3072M
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 3072M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
