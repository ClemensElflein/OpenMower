[Unit]
After=openmower-ssh-hostkeys.service
Requires=openmower-ssh-hostkeys.service

[Service]
# Upstream unit's ExecStartPre (`ssh-keygen -A`) targets /etc/ssh, which is
# read-only here and would fail every boot. openmower-ssh-hostkeys.service
# generates the key on /data instead; point sshd at it directly.
ExecStartPre=
ExecStart=
ExecStart=/usr/sbin/sshd -D -e -o HostKey=/data/ssh/ssh_host_ed25519_key
