[Service]
# Upstream unit's ExecStartPre (`ssh-keygen -A`) targets /etc/ssh, which is
# read-only here and would fail every boot -- moot anyway since the host
# key is baked into the image at build time (see post-build.sh,
# keys-gen-dev.sh), not generated at runtime, so there's nothing for
# ssh-keygen -A to do here even on a writable /etc. Explicit HostKey=
# instead of relying on sshd's own /etc/ssh/ssh_host_ed25519_key default
# purely to keep this override self-contained/obvious; same path either way.
ExecStartPre=
ExecStart=
ExecStart=/usr/sbin/sshd -D -e -o HostKey=/etc/ssh/ssh_host_ed25519_key
