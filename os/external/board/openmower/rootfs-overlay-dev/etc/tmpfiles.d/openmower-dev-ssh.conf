# Dev image only. Seed the baked dev SSH key onto root's real, persistent
# $HOME (/data/.openmower-os/root -- see post-build.sh's passwd rewrite);
# openssh resolves AuthorizedKeysFile against that path, not /root, so a
# build-time file at /root/.ssh would never be found.
d /data/.openmower-os/root/.ssh 0700 root root -
C /data/.openmower-os/root/.ssh/authorized_keys 0600 root root - /etc/openmower/dev-ssh-authorized-keys
