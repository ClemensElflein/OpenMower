# openssh's own build-time install (openssh.mk's OPENSSH_PERMISSIONS,
# "/var/empty d 755 root root") only bakes this onto the read-only squashfs
# -- /var itself is a fresh tmpfs every boot (see /etc/fstab), so that
# directory is gone by the time sshd needs it for privilege-separation
# chroot, and sshd fails to start. Recreate it every boot instead.
d /var/empty 0755 root root -
