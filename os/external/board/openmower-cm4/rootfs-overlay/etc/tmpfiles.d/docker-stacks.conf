# Persistent storage for Docker itself and the auxiliary GUI stack
# (Mosquitto, OpenMowerApp, Dockge, ttyd -- see README's "Manage OpenMower
# stack" section). /opt/stacks and /opt/dockge are symlinks into here (baked
# in post-build.sh), same reason as /etc/dropbear -> /data/dropbear: root is
# read-only squashfs and /var is tmpfs (RAM, wiped every boot), so anything
# these need to survive a reboot or an A/B update has to live on /data.
d /data/docker 0711 root root -
d /data/stacks 0755 root root -
d /data/stacks/openmower 0755 root root -
d /data/stacks/webterminal 0755 root root -
d /data/dockge 0755 root root -
d /data/dockge/data 0755 root root -

# First-boot defaults (only copied if the destination doesn't already exist,
# so edits made via Dockge/by hand survive both reboots and RAUC A/B
# updates) -- same "C" pattern as /data/openmower/openmower.conf, see
# rootfs-overlay/etc/tmpfiles.d/openmower.conf.
C /data/stacks/openmower/compose.yaml 0644 root root - /etc/openmower-stack/compose.yaml.default
C /data/stacks/openmower/.env 0644 root root - /etc/openmower-stack/env.default
C /data/stacks/openmower/mosquitto.conf 0644 root root - /etc/openmower-stack/mosquitto.conf.default
C /data/stacks/webterminal/compose.yaml 0644 root root - /etc/webterminal-stack/compose.yaml.default
C /data/stacks/webterminal/.env 0644 root root - /etc/webterminal-stack/env.default
C /data/dockge/compose.yaml 0644 root root - /etc/dockge-stack/compose.yaml.default
# Dockge's own data/ (its SQLite DB), ported byte-identical from the
# predecessor (stage-openmower/32-dockge/files/opt/dockge/data/): auth
# disabled (setting.disableAuth=true) and one jwtSecret, the same on every
# device -- a deliberate fleet-wide trade-off, not an oversight, see
# README's "Known trade-offs". Anyone who can reach :5001 gets unauthenticated
# container control; keep this off untrusted networks.
C /data/dockge/data/dockge.db 0644 root root - /etc/dockge-stack/dockge.db.default
C /data/dockge/data/db-config.json 0644 root root - /etc/dockge-stack/db-config.json.default
