# DHCP server for the internal CM4<->xCore link only (eth0, 172.16.78.0/24).
# Just one instance -- no second dnsmasq for a WiFi-AP fallback (no
# AP/captive-portal path here).
#
# DNS service intentionally disabled (port=0) -- systemd-resolved already
# owns that (see /etc/nsswitch.conf), no reason to run two.
port=0

interface=eth0
bind-dynamic
listen-address=172.16.78.1

dhcp-range=172.16.78.150,172.16.78.200,255.255.255.0,1h
dhcp-sequential-ip
log-dhcp
