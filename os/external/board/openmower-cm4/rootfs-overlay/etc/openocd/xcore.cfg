#
# OpenOCD config for flashing/debugging the xCore (LL board MCU) via SWD,
# using the CM4/Pi4 (BCM2711) itself as a bitbang adapter. Uses the
# `bcm2835gpio` driver (BR2_PACKAGE_OPENOCD_BCM2835): the only GPIO backend
# buildroot builds for CM4/Pi4 (BCM2711) -- `linuxgpiod` needs a Pi 5, which
# dropped direct register access -- and it's also the faster option on this
# SoC anyway.
#
# Usage: openocd -f /etc/openocd/xcore.cfg
#
# Not verified on real hardware -- check swclk/swdio pin numbers and
# peripheral_base against your actual wiring before relying on this.

adapter driver bcm2835gpio

# BCM2711 (Pi4/CM4) peripheral base -- 0x3F000000 on BCM2837 (Pi3) or
# 0x20000000 on BCM2835/2836 (Pi1/Zero/Pi2), neither of which is us.
bcm2835gpio peripheral_base 0xFE000000

# Each of the SWD lines need a gpio number set: swclk swdio
# OpenMower pins
adapter gpio swclk -chip 0 27
adapter gpio swdio -chip 0 22

transport select swd
