# hci_uart is a module (see board/openmower-cm4/kernel-fragment.config): serdev
# has no udev hotplug autoload, so load it explicitly here. This runs via
# systemd-modules-load.service, well after root (and /lib/firmware) is
# mounted, avoiding the early-boot firmware-request race a built-in driver
# would hit.
hci_uart
