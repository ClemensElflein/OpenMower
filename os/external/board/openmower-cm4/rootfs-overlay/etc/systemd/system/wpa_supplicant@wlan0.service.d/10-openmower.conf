[Unit]
# Only run once wifi has been provisioned (config lives on /data).
ConditionPathExists=/data/wifi/wpa_supplicant-wlan0.conf
RequiresMountsFor=/data

[Service]
# The upstream template reads /etc/wpa_supplicant/wpa_supplicant-%I.conf.
# Credentials must persist across A/B rootfs updates, so use the /data copy
# produced by improv-ble instead.
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c/data/wifi/wpa_supplicant-wlan0.conf -iwlan0

# brcmfmac power save causes latency spikes/drops; force it off. The nl80211
# setting is independent of wpa_supplicant's own state, so this is safe to
# run right after ExecStart spawns.
ExecStartPost=/usr/sbin/iw dev wlan0 set power_save off

# brcmfmac is built into the kernel and probes the SDIO chip + uploads
# firmware asynchronously; the wlan0 "add" uevent that triggers this unit
# can fire before that finishes, so the first start can race the driver and
# exit nonzero. Upstream ships no restart policy, so retry until it wins.
Restart=on-failure
RestartSec=2
