[Service]
# ttyGS0 is a last-resort physical/USB console -- whatever terminal app
# someone reaches for there (commonly minicom) can't be assumed to
# actually support what it claims via $TERM. Concretely: systemd's own
# /etc/profile.d/80-systemd-osc-context.sh (OSC 3008 shell-integration
# escapes) only self-disables when $TERM is exactly "dumb"; minicom
# reports a capable $TERM (vt100/xterm) but doesn't swallow unrecognized
# OSC sequences the way a real terminal emulator should, so every prompt/
# command dumps raw escape-sequence garbage onto the screen. Forcing
# TERM=dumb here hits that existing upstream guard directly -- no need to
# fork/patch systemd's own script. Trade-off: readline drops full line
# editing under TERM=dumb (no arrow-key history recall, no tab-completion
# redraw) -- acceptable here since this is a last-resort debug console,
# not primary interactive use (that's SSH, unaffected by this).
Environment=TERM=dumb
