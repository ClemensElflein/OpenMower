[Service]
# Same reasoning as serial-getty@ttyGS0's drop-in in the shared overlay:
# forces TERM=dumb so systemd's own OSC-3008 shell-integration profile
# script (/etc/profile.d/80-systemd-osc-context.sh) self-disables via its
# existing $TERM check, instead of dumping raw escape-sequence garbage
# into minicom (or similar) on this dev UART header console.
Environment=TERM=dumb
